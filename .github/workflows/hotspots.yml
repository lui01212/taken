name: Hotspot badge refresh

# Keeps docs/badges/hotspot.json (the README "hotspots" badge) in sync with
# main. The badge is computed from git history, so it is recomputed here on
# every push to main; when the numbers changed, a refresh PR is opened. The
# PR goes through the normal required checks like any other change.
#
# The refresh-branch push and the auto-merge both use the HOTSPOT_MERGE_PAT
# secret (a fine-grained PAT), not GITHUB_TOKEN: bot-attributed pushes
# produce pull_request runs that fail immediately with zero jobs, so
# required checks fail and auto-merge never fires (#361).
# Merges attributed to GITHUB_TOKEN do not trigger new workflow runs, which
# left main's HEAD with no CI signal (#88).

permissions: {}

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: churn needs every commit
          # The persisted credential below is what `git push` uses for the
          # refresh branch; it must be the PAT (see header comment, #361).
          token: ${{ secrets.HOTSPOT_MERGE_PAT }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Recompute hotspot metrics
        run: uv run --python 3.12 --with radon scripts/hotspots.py
      - name: Open refresh PR if the badge changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_TOKEN: ${{ secrets.HOTSPOT_MERGE_PAT }}
        run: |
          if git diff --quiet -- docs/badges/hotspot.json; then
            echo "badge unchanged, nothing to do"
            exit 0
          fi
          OPEN=$(gh pr list --state open \
            --search "refresh hotspot badge metrics in:title" \
            --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            echo "a refresh PR is already open, skipping"
            exit 0
          fi
          BRANCH="chore/hotspot-refresh-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/badges/hotspot.json
          git commit -m "chore: refresh hotspot badge metrics"
          git push origin "$BRANCH"
          MSG=$(python -c "import json; b=json.load(open('docs/badges/hotspot.json')); print(b['message'])")
          gh pr create --base main --head "$BRANCH" \
            --title "chore: refresh hotspot badge metrics" \
            --body "Refresh of the README hotspots badge (assessed at ${GITHUB_SHA::7}). Current reading: **${MSG}**. Metric: cyclomatic complexity x commit churn per file; see \`scripts/hotspots.py\`."
          # A merge enabled with GITHUB_TOKEN does not trigger new workflow
          # runs, leaving main's HEAD with no CI signal (#88). Enabling the
          # auto-merge with a PAT attributes the merge to a user, so CI and
          # SonarQube run on the merge commit as usual.
          if [ -n "$MERGE_TOKEN" ]; then
            GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash "$BRANCH"
          else
            echo "WARNING: HOTSPOT_MERGE_PAT is not set; falling back to GITHUB_TOKEN (post-merge CI will not run, see #88)"
            gh pr merge --auto --squash "$BRANCH"
          fi
