name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      npm_only_version:
        description: >-
          Version (X.Y.Z) to publish to npm only. Skips the PyPI, MCP
          registry, and .deb jobs; they must already be done for this
          version. Use only when the tag-triggered npm job could not run.
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build
        run: uv build
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Publish to PyPI
        run: uv publish

  publish-registry:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
      - name: Sync server.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import json, os
          tag = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
          with open("server.json") as f:
              srv = json.load(f)
          srv["version"] = tag
          for p in srv.get("packages", []):
              p["version"] = tag
          with open("server.json", "w") as f:
              json.dump(srv, f, indent=2)
              f.write("\n")
          print("server.json version set to", tag)
          EOF
      - name: Validate server.json
        run: /tmp/mcp-publisher validate
      - name: Wait for PyPI propagation
        run: |
          VER=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            if curl -sf "https://pypi.org/pypi/taken-gh/${VER}/json" -o /dev/null; then
              echo "taken-gh ${VER} is live on PyPI"
              exit 0
            fi
            echo "waiting for taken-gh ${VER} on PyPI (attempt $i/30)..."
            sleep 20
          done
          echo "timed out waiting for taken-gh ${VER} on PyPI" >&2
          exit 1
      - name: Login to MCP Registry (OIDC)
        run: /tmp/mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: /tmp/mcp-publisher publish

  build-deb:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build wheel and vendor dependency wheels
        run: |
          uv build
          mkdir -p deb-wheels
          # Vendor the full runtime dependency closure so the offline
          # --no-index postinst install succeeds. Requirements are read
          # from the built wheel's METADATA (not hardcoded) so this stays
          # correct as dependencies change.
          REQS=$(python3 - <<'EOF'
          import glob, zipfile, email
          from email.policy import default
          wheel = sorted(glob.glob("dist/taken_gh-*-py3-none-any.whl"))[0]
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              msg = email.message_from_string(z.read(name).decode(), policy=default)
          for req in msg.get_all("Requires-Dist") or []:
              print(req)
          EOF
          )
          # shellcheck disable=SC2086
          python3 -m pip download -d deb-wheels $REQS
      - name: Assemble the .deb package
        run: |
          set -e
          VER="${GITHUB_REF#refs/tags/v}"
          PKGDIR="deb-pkg"
          mkdir -p "$PKGDIR/DEBIAN" "$PKGDIR/usr/share/taken/wheels"
          cp dist/taken_gh-*-py3-none-any.whl deb-wheels/*.whl "$PKGDIR/usr/share/taken/wheels/"
          cat > "$PKGDIR/DEBIAN/control" <<EOF
          Package: taken
          Version: $VER
          Section: utils
          Priority: optional
          Architecture: all
          Depends: python3, python3-venv
          Maintainer: RogueAlg0
          Description: Answer 'taken?' for any GitHub issue before volunteering
           A small CLI that checks whether a GitHub issue is already being
           worked on, with GO/TAKEN/CAUTION verdicts. Also ships taken-mcp,
           an MCP server exposing the same checks to AI assistants.
          EOF
          cat > "$PKGDIR/DEBIAN/postinst" <<'SCRIPT'
          #!/bin/sh
          set -e
          VENV=/usr/lib/taken/venv
          rm -rf "$VENV"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install --quiet --disable-pip-version-check \
            --no-index --find-links=/usr/share/taken/wheels taken-gh
          ln -sf "$VENV/bin/taken" /usr/bin/taken
          ln -sf "$VENV/bin/taken-mcp" /usr/bin/taken-mcp
          SCRIPT
          cat > "$PKGDIR/DEBIAN/prerm" <<'SCRIPT'
          #!/bin/sh
          set -e
          rm -f /usr/bin/taken /usr/bin/taken-mcp
          rm -rf /usr/lib/taken
          SCRIPT
          chmod 0755 "$PKGDIR/DEBIAN/postinst" "$PKGDIR/DEBIAN/prerm"
          chmod 0755 "$PKGDIR/DEBIAN"
          dpkg-deb --build "$PKGDIR" "taken_${VER}_all.deb"
          dpkg-deb --info "taken_${VER}_all.deb"
      - name: Attest SLSA build provenance for the .deb
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'taken_*_all.deb'
      - name: Attach .deb to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DEB="taken_${TAG#v}_all.deb"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$DEB" --clobber

  build-windows:
    # One-file Windows executables for WinGet distribution. Built with
    # PyInstaller on windows-latest so Windows users get a native
    # taken.exe with no Python required. The zip is attached to the
    # tag's GitHub Release alongside the .deb; the winget-pkgs manifest
    # (packaging/winget/) points at it. See packaging/winget/README.md.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller and taken
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .
      - name: Build one-file executables
        # taken/__main__.py calls taken.cli:main; taken/mcp_server.py has a
        # __main__ guard. No data files are bundled: the taken package is
        # pure code and its runtime deps (tqdm, mcp) are pure Python.
        run: |
          pyinstaller --onefile --console --name taken taken/__main__.py
          pyinstaller --onefile --console --name taken-mcp taken/mcp_server.py
      - name: Smoke-test the executables
        run: |
          dist/taken.exe --version
          dist/taken-mcp.exe < /dev/null || true
      - name: Zip the executables
        run: |
          python - <<'EOF'
          import os, zipfile
          ver = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          name = f"taken_{ver}_windows-x64.zip"
          with zipfile.ZipFile(name, "w", zipfile.ZIP_DEFLATED) as z:
              z.write("dist/taken.exe", "taken.exe")
              z.write("dist/taken-mcp.exe", "taken-mcp.exe")
          print("wrote", name)
          EOF
      - name: Attach Windows zip to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ZIP="taken_${TAG#v}_windows-x64.zip"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$ZIP" --clobber

  npm:
    name: Publish npm installer (taken-gh)
    runs-on: ubuntu-latest
    # PyPI must be live first: the npm postinstall step pip-installs the
    # matching taken-gh release from PyPI.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 bundles npm >= 11.5.1, which supports OIDC trusted
          # publishing, so no separate npm upgrade step is needed.
          node-version: "24"
      - name: Check npm and PyPI versions match the tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NPM_VER=$(node -p "require('./npm/package.json').version")
          if [ "$NPM_VER" != "$VER" ]; then
            echo "npm/package.json version ($NPM_VER) does not match tag ($VER); refusing to publish."
            exit 1
          fi
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          NPM_VER="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "11.5.1" "$NPM_VER" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "npm $NPM_VER predates OIDC trusted publishing (needs >= 11.5.1); refusing to publish."
            exit 1
          fi
      - name: Publish to npm
        working-directory: npm
        # No NODE_AUTH_TOKEN on purpose: auth comes from the trusted
        # publisher configured on npmjs.com, exchanged via this job's
        # id-token. Anyone reusing this workflow file without that setup must
        # skip OIDC and fail.
        run: npm publish --access public --provenance

  npm-only:
    name: Publish npm installer only (manual recovery)
    # Recovery path for when the tag-triggered npm job could not run
    # (e.g. PyPI already had the version, so the normal publish job failed).
    # No needs: this job must not depend on a fresh PyPI publish.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.npm_only_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Serialize concurrent dispatches for the same version: the job's
    # check-then-act (npm view, then publish) is not atomic, so two
    # dispatches racing would both see the version absent and both
    # publish, with npm rejecting the loser. Queued, not cancelled, so
    # the second dispatch still runs and exits as the intended no-op.
    # Tag-triggered publishes are unaffected: they do not use this job.
    concurrency:
      group: npm-only-${{ github.event.inputs.npm_only_version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ github.event.inputs.npm_only_version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 24 bundles npm >= 11.5.1, which supports OIDC trusted
          # publishing, so no separate npm upgrade step is needed.
          node-version: "24"
      - name: Check the requested version is valid and ready
        run: |
          VER="${{ github.event.inputs.npm_only_version }}"
          if ! printf '%s' "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "npm_only_version ($VER) is not a plain X.Y.Z version; refusing to publish."
            exit 1
          fi
          NPM_VER=$(node -p "require('./npm/package.json').version")
          if [ "$NPM_VER" != "$VER" ]; then
            echo "npm/package.json version ($NPM_VER) does not match the requested version ($VER); refusing to publish."
            exit 1
          fi
          # PyPI must already have this version: the npm postinstall step
          # pip-installs taken-gh==$VER from PyPI.
          for i in $(seq 1 10); do
            if curl -sf "https://pypi.org/pypi/taken-gh/${VER}/json" -o /dev/null; then
              echo "taken-gh ${VER} is live on PyPI"
              exit 0
            fi
            echo "waiting for taken-gh ${VER} on PyPI (attempt $i/10)..."
            sleep 20
          done
          echo "taken-gh ${VER} is not on PyPI; refusing to publish." >&2
          exit 1
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          NPM_VER="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "11.5.1" "$NPM_VER" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "npm $NPM_VER predates OIDC trusted publishing (needs >= 11.5.1); refusing to publish."
            exit 1
          fi
      - name: Publish to npm
        working-directory: npm
        # No NODE_AUTH_TOKEN on purpose: auth comes from the trusted
        # publisher configured on npmjs.com, exchanged via this job's
        # id-token. Anyone reusing this workflow file without that setup must
        # skip OIDC and fail.
        run: |
          VER="${{ github.event.inputs.npm_only_version }}"
          if npm view "taken-gh@${VER}" version >/dev/null 2>&1; then
            echo "taken-gh@${VER} is already published on npm; nothing to do."
            exit 0
          fi
          npm publish --access public --provenance
